<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Templates — AnimateItNow</title>
    <meta name="description" content="Browse our collection of CSS animation templates and effects for modern web development." />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="design-system.css" />
    <link rel="stylesheet" href="templates.css" />
    <script src="site.js"></script>
  </head>
  <body>
    <main>
      <section class="ds-hero gallery-hero">
        <div class="container">
          <span class="ds-eyebrow"><i class="fas fa-palette"></i> Template library</span>
          <h1>Template <span class="gradient-text">gallery</span></h1>
          <p>Production-ready animated templates. Preview any of them live, then copy the code into your project.</p>

          <div class="search-container">
            <i class="fas fa-search search-icon" aria-hidden="true"></i>
            <input type="search" id="search-bar" placeholder="Search templates…" aria-label="Search templates" autocomplete="off" />
          </div>
          <div class="filter-container" role="group" aria-label="Filter by category">
            <button class="filter-btn active" data-filter="all">All templates</button>
            <button class="filter-btn" data-filter="navbar">Navigation</button>
            <button class="filter-btn" data-filter="button">Buttons</button>
            <button class="filter-btn" data-filter="card">Cards</button>
            <button class="filter-btn" data-filter="form">Forms</button>
            <button class="filter-btn" data-filter="landing">Landing pages</button>
            <button class="filter-btn" data-filter="other">Other</button>
            <button class="filter-btn" data-filter="favorites"><i class="fas fa-star"></i> Favorites</button>
          </div>
        </div>
      </section>

      <section class="gallery">
        <div class="container">
          <div class="gallery__bar"><span id="resultCount" aria-live="polite"></span></div>
          <div class="templates-grid" id="templatesGrid"></div>
        </div>
      </section>
    </main>
    <script src="templates.js"></script>
  </body>
</html>
