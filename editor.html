<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Editor — AnimateItNow</title>
    <meta name="description" content="Write, run and test HTML, CSS and JavaScript animations in real time." />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="design-system.css" />
    <link rel="stylesheet" href="editor.css" />
    <script src="site.js"></script>
  </head>
  <body data-no-footer>
    <div class="workbench">
      <div class="toolbar">
        <div class="toolbar__title">
          <h1>Live editor</h1>
          <span>Write, run and test HTML, CSS &amp; JavaScript in real time.</span>
        </div>
        <div class="toolbar__actions">
          <label class="switch" title="Re-run automatically while you type">
            <input type="checkbox" id="autoRun" checked />
            <span class="switch__track"></span>
            <span class="switch__label">Auto-run</span>
          </label>
          <button id="copyBtn" class="tool-btn" type="button" title="Copy the active file"><i class="fas fa-copy"></i><span>Copy</span></button>
          <button id="resetBtn" class="tool-btn" type="button" title="Reset to the starter code"><i class="fas fa-rotate-left"></i><span>Reset</span></button>
          <button id="runBtn" class="btn" type="button"><i class="fas fa-play"></i> Run</button>
        </div>
      </div>

      <div class="panes">
        <section class="pane pane--code" aria-label="Code">
          <div class="tabs" role="tablist">
            <button class="tab is-active" role="tab" aria-selected="true" data-tab="html"><i class="fab fa-html5"></i> HTML</button>
            <button class="tab" role="tab" aria-selected="false" data-tab="css"><i class="fab fa-css3-alt"></i> CSS</button>
            <button class="tab" role="tab" aria-selected="false" data-tab="js"><i class="fab fa-js"></i> JavaScript</button>
          </div>
          <textarea id="htmlCode" class="code-area" data-lang="html" spellcheck="false" aria-label="HTML code"></textarea>
          <textarea id="cssCode" class="code-area" data-lang="css" spellcheck="false" aria-label="CSS code" hidden></textarea>
          <textarea id="jsCode" class="code-area" data-lang="js" spellcheck="false" aria-label="JavaScript code" hidden></textarea>
        </section>

        <section class="pane pane--preview" aria-label="Preview">
          <div class="preview__bar">
            <span class="preview__title"><i class="fas fa-eye"></i> Preview</span>
            <div class="preview__actions">
              <button id="refreshBtn" class="icon-btn" type="button" title="Refresh preview" aria-label="Refresh preview"><i class="fas fa-rotate"></i></button>
              <button id="fullscreenBtn" class="icon-btn" type="button" title="Fullscreen preview" aria-label="Fullscreen preview"><i class="fas fa-expand"></i></button>
            </div>
          </div>
          <iframe id="output" class="output-frame" title="Live preview" sandbox="allow-scripts allow-modals"></iframe>
        </section>
      </div>
    </div>
    <script src="editor.js"></script>
  </body>
</html>
